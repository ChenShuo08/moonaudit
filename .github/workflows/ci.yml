name: CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: moonbitlang/setup-moonbit@v1
      - run: moon test tests
      - run: moon run src/main -- audit examples/sample-project --format markdown
      - run: moon run src/main -- audit examples/sample-project --format json
